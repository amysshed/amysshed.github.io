<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio</title>

<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" href="IX8/UI/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Rock+3D&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>

<body class="sketchbook-page">

<div id="header"></div>

<script>
  fetch("header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;
    });
</script>

<main>

<div class="sketchbook-controls">
  <div class="filter-container">
    <button class="filter-toggle">Filter</button>

    <div class="filter-menu">
      <button data-filter="all">All</button>
      <button data-filter="paintings">Paintings</button>
      <button data-filter="sketches">Sketches</button>
    </div>
  </div>
</div>

<section id="sketchbook-gallery" class="sketchbook-gallery">

<div class="sketchbook-gallery"></div>

</section>

</main>

<footer>
  <p>© 2026. All rights reserved.</p>
</footer>

<script src="js/sketchbook.js"></script>

</body>
</html>
